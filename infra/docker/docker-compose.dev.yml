version: "3.9"

# Development overrides
# Exposes service ports to host for local development tooling.
# In production, remove or replace this file to restrict port exposure.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
