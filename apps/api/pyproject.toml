[project]
name = "compressor-api"
version = "0.1.0"
description = "FastAPI backend for the Compressor Knowledge Extraction Platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.18",
    "minio>=7.2.0",
    "redis>=5.2.0",
    "openai>=1.60.0",
    "tiktoken>=0.8.0",
    "pymupdf4llm>=0.0.17",
    "domain",
    "storage",
    "parsing",
    "cleaning",
    "splitters",
    "llm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
domain = { workspace = true }
storage = { workspace = true }
parsing = { workspace = true }
cleaning = { workspace = true }
splitters = { workspace = true }
llm = { workspace = true }

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
