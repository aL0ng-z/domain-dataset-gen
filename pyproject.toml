[project]
name = "compressor-knowledge-platform"
version = "0.1.0"
description = "Web platform for extracting domain knowledge from PDF textbooks on compressor design"
requires-python = ">=3.11,<3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "libs/domain",
    "libs/storage",
    "libs/parsing",
    "libs/cleaning",
    "libs/splitters",
    "libs/llm",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "domain", "storage", "parsing", "cleaning", "splitters", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]
# 统一测试导入路径，无需手工设置 PYTHONPATH。
# 与 scripts/dev-start-conda.ps1 中的 BackendPythonPathEntries 保持一致。
pythonpath = [
    "apps/api",
    "libs/domain",
    "libs/storage",
    "libs/parsing",
    "libs/cleaning",
    "libs/splitters",
    "libs/llm",
]
markers = [
    "integration: 依赖 PostgreSQL/Redis/MinIO 隔离测试基础设施的集成测试",
    "contract: 外部服务 adapter 契约测试（默认使用 fake，不请求真实服务）",
    "smoke: 真实外部服务冒烟测试，默认跳过，永不进入普通 CI",
]

[tool.coverage.run]
branch = true
source = ["app", "domain", "storage", "parsing", "cleaning", "splitters", "llm"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/app/workers/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
