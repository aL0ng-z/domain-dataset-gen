[project]
name = "compressor-knowledge-platform"
version = "0.1.0"
description = "Web platform for extracting domain knowledge from PDF textbooks on compressor design"
requires-python = ">=3.11,<3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "libs/domain",
    "libs/storage",
    "libs/parsing",
    "libs/cleaning",
    "libs/splitters",
    "libs/llm",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "domain", "storage", "parsing", "cleaning", "splitters", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
