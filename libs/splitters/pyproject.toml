[project]
name = "splitters"
version = "0.1.0"
description = "Text chunking strategies"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["splitters*"]
