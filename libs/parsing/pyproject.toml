[project]
name = "parsing"
version = "0.1.0"
description = "Document parsing wrappers (MinerU, PaddleOCR)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "mineru-vl-utils[transformers]",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["parsing*"]
